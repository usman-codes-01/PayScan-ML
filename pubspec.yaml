name: card_scanner
description: "A high-performance Flutter Credit Card Scanner using ML Kit."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Camera & ML
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.13.0

  # Utilities
  permission_handler: ^11.3.0
  vibration: ^1.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true